# Alembic configuration for the Tokyo Apartment Search backend.
#
# The DB URL is NOT hardcoded here — env.py reads it from the app Settings
# (DATABASE_URL) and rewrites the async driver to the sync psycopg2 driver that
# Alembic needs. So `alembic upgrade head` uses the same DB as the app.

[alembic]
script_location = alembic
prepend_sys_path = .
# Use a path separator appropriate for the OS.
path_separator = os

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
